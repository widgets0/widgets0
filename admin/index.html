<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olly · Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f3f0;
      --panel: #ffffff;
      --ink: #12181d;
      --muted: #6b7580;
      --soft: #7c8792;
      --line: rgba(17, 24, 28, 0.1);
      --line-strong: rgba(17, 24, 28, 0.16);
      --nav: #0e1a24;
      --blue: #256fd4;
      --blue-soft: #eef5ff;
      --green: #20a46b;
      --green-soft: #e9f8f0;
      --red: #ce4b52;
      --red-soft: #fff0f0;
      --gold: #c99236;
      --gold-soft: #fff5dc;
      --shadow: 0 18px 46px rgba(17, 24, 28, 0.08);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font: "Manrope", Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      min-width: 1120px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 72px;
    }

    .topbar {
      background: var(--nav);
      color: #fff;
      padding: 22px 40px 20px;
    }

    .topbar__inner {
      width: min(1320px, calc(100vw - 80px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }

    .brand {
      width: 136px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      flex: 0 0 auto;
    }

    .brand img {
      width: 106px;
      height: auto;
      display: block;
    }

    .divider {
      width: 1px;
      height: 34px;
      background: rgba(255, 255, 255, 0.16);
      flex: 0 0 auto;
    }

    .top-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .eyebrow {
      margin: 0;
      color: rgba(255, 255, 255, 0.48);
      font: 500 10px/1 var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .top-button,
    .button {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
    }

    .top-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #fff;
    }

    .top-button:hover,
    .button:hover {
      transform: translateY(-1px);
    }

    .top-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .top-button--solid {
      border-color: #fff;
      background: #fff;
      color: var(--nav);
    }

    .top-button--solid:hover {
      background: #e9eef3;
    }

    main {
      width: min(1320px, calc(100vw - 80px));
      margin: 0 auto;
      padding: 0 0 72px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--line);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(17, 24, 28, 0.04);
    }

    .summary-card {
      min-height: 116px;
      padding: 20px 22px 18px;
      background: var(--panel);
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .summary-card__label,
    .section-label,
    .widget-chip-label,
    .metric__label {
      color: var(--soft);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .summary-card__value {
      color: var(--ink);
      font: 700 34px/1 var(--mono);
      letter-spacing: -0.03em;
    }

    .summary-card__value--blue {
      color: var(--blue);
    }

    .summary-card__value-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .summary-card__change {
      color: var(--green);
      font: 700 12px/1 var(--mono);
    }

    .summary-card__note {
      color: var(--soft);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 600;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 36px 0 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(17, 24, 28, 0.09);
    }

    .section-label {
      margin-right: 2px;
      font-size: 10.5px;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      color: #3b444d;
      cursor: pointer;
      font-size: 12.5px;
      line-height: 1;
      font-weight: 700;
    }

    .filter-pill span {
      color: #9aa3ab;
      font: 700 11px/1 var(--mono);
    }

    .filter-pill.is-active {
      background: var(--nav);
      border-color: var(--nav);
      color: #fff;
    }

    .filter-pill.is-active span {
      color: rgba(255, 255, 255, 0.5);
    }

    .reset-filter {
      padding: 0 6px;
      color: var(--blue);
      background: transparent;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 700;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 16px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .count-label {
      color: var(--soft);
      font: 500 13px/1 var(--mono);
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search {
      width: 310px;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      outline: none;
      font-size: 13px;
      font-weight: 600;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 111, 212, 0.12);
    }

    .button {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
    }

    .button--primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      box-shadow: 0 10px 20px rgba(37, 111, 212, 0.16);
    }

    .widgets {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .widget-card {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(17, 24, 28, 0.035);
    }

    .widget-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 28px;
    }

    .widget-info {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      min-width: 0;
    }

    .widget-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: var(--blue-soft);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .widget-icon__wheel {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      border-right-color: #c9ddff;
      border-bottom-color: #c9ddff;
    }

    .widget-icon__cards {
      position: relative;
      width: 22px;
      height: 20px;
    }

    .widget-icon__cards::before,
    .widget-icon__cards::after {
      content: "";
      position: absolute;
      inset: 2px 5px 2px 5px;
      border-radius: 5px;
      border: 2px solid var(--blue);
      background: #fff;
    }

    .widget-icon__cards::before {
      transform: rotate(-10deg) translateX(-4px);
      opacity: 0.5;
    }

    .widget-icon__cards::after {
      transform: rotate(8deg) translateX(4px);
    }

    .widget-copy {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .widget-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .widget-title {
      color: var(--ink);
      font-size: 16px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--green-soft);
      color: #15794f;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
    }

    .status--waiting {
      background: var(--gold-soft);
      color: #865b0d;
    }

    .status--off {
      background: #edf0f3;
      color: #7c8792;
    }

    .widget-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.2;
      font-weight: 600;
    }

    .widget-meta strong,
    .mono {
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 600;
    }

    .sep {
      color: rgba(17, 24, 28, 0.2);
    }

    .widget-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .switch-wrap {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding-left: 6px;
      cursor: pointer;
      user-select: none;
    }

    .switch-label {
      color: var(--green);
      font-size: 12px;
      line-height: 1;
      font-weight: 800;
    }

    .switch-label.is-off {
      color: var(--soft);
    }

    .switch {
      width: 40px;
      height: 23px;
      padding: 3px;
      border-radius: 999px;
      background: var(--green);
      display: flex;
      justify-content: flex-end;
      transition: background 0.18s ease;
    }

    .switch::after {
      content: "";
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .switch.is-off {
      justify-content: flex-start;
      background: rgba(17, 24, 28, 0.18);
    }

    .behavior {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .behavior-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 11px;
      border-radius: 7px;
      background: var(--bg);
      color: #3b444d;
      font-size: 12px;
      line-height: 1;
      font-weight: 600;
    }

    .funnel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) minmax(190px, 0.52fr);
      align-items: stretch;
      border: 1px solid rgba(17, 24, 28, 0.09);
      border-radius: 11px;
      background: #fdfdfc;
      overflow: hidden;
    }

    .metric {
      min-width: 0;
      padding: 15px 18px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .metric__value {
      color: var(--ink);
      font: 700 24px/1 var(--mono);
      letter-spacing: -0.02em;
    }

    .metric__value--blue {
      color: var(--blue);
    }

    .metric__row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .metric__sub {
      color: var(--muted);
      font: 700 11px/1 var(--mono);
    }

    .bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(17, 24, 28, 0.09);
      overflow: hidden;
    }

    .bar span {
      display: block;
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: #2d3a45;
    }

    .bar--blue span {
      background: var(--blue);
    }

    .bar--green span {
      background: var(--green);
    }

    .rate {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .rate span {
      padding: 5px 7px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      font: 700 11px/1 var(--mono);
    }

    .side-metric {
      border-left: 1px solid rgba(17, 24, 28, 0.09);
      padding: 15px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      background: #fbfaf8;
    }

    .side-metric__top {
      display: grid;
      gap: 8px;
    }

    .side-metric__value {
      color: var(--red);
      font: 700 18px/1 var(--mono);
    }

    .empty {
      padding: 34px;
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(14, 26, 36, 0.62);
    }

    .modal-backdrop.is-visible {
      display: flex;
    }

    .modal {
      width: min(760px, 100%);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
      overflow: hidden;
    }

    .modal__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal__title {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.2;
      font-weight: 800;
    }

    .modal__body {
      padding: 20px;
    }

    .code {
      display: block;
      width: 100%;
      min-height: 150px;
      margin: 0;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0e1a24;
      color: #e7edf4;
      white-space: pre-wrap;
      word-break: break-word;
      font: 500 12px/1.55 var(--mono);
    }

    .modal__actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 30;
      transform: translateX(-50%) translateY(14px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--nav);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1180px) {
      body {
        min-width: 0;
      }

      .topbar__inner,
      main {
        width: min(940px, calc(100vw - 32px));
      }

      .topbar__inner,
      .widget-card__top,
      .section-head {
        align-items: stretch;
        flex-direction: column;
      }

      .top-actions,
      .tools,
      .widget-actions {
        flex-wrap: wrap;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .search {
        width: min(100%, 420px);
      }

      .funnel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .rate {
        display: none;
      }

      .side-metric {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid rgba(17, 24, 28, 0.09);
      }
    }

    @media (max-width: 720px) {
      .topbar {
        padding: 18px 16px;
      }

      main {
        width: calc(100vw - 24px);
      }

      .brand-line {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
      }

      .divider {
        display: none;
      }

      .summary,
      .funnel {
        grid-template-columns: 1fr;
      }

      .filters {
        margin-top: 24px;
      }

      .metric {
        border-bottom: 1px solid rgba(17, 24, 28, 0.09);
      }

      .widget-info {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand-line">
          <a class="brand" href="../gallery/" aria-label="Olly">
            <img src="../brand-logo.png" alt="Olly">
          </a>
          <div class="divider" aria-hidden="true"></div>
          <div class="top-title">
            <p class="eyebrow">Личный кабинет</p>
            <h1>Статистика виджетов</h1>
          </div>
        </div>
        <div class="top-actions">
          <a class="top-button" href="https://widgets0.github.io/widgets0/gallery/" target="_blank" rel="noreferrer">Перейти на сайт</a>
          <a class="top-button top-button--solid" href="https://widgets0.github.io/widgets0/gallery/" target="_blank" rel="noreferrer">Галерея виджетов</a>
          <button class="top-button" data-action="sync">Синхронизировать</button>
        </div>
      </div>
    </header>

    <main>
      <section class="summary" aria-label="Сводка">
        <article class="summary-card">
          <span class="summary-card__label">Всего проектов</span>
          <span class="summary-card__value summary-card__value--blue" data-stat="projects">0</span>
          <span class="summary-card__note" data-stat-note="projects">подключено</span>
        </article>
        <article class="summary-card">
          <span class="summary-card__label">Всего виджетов</span>
          <span class="summary-card__value" data-stat="total">0</span>
          <span class="summary-card__note" data-stat-note="active">сейчас включены</span>
        </article>
        <article class="summary-card">
          <span class="summary-card__label">Показов за 30 дней</span>
          <span class="summary-card__value" data-stat="shows">0</span>
          <span class="summary-card__note" data-stat-note="sites">по подключённым сайтам</span>
        </article>
        <article class="summary-card">
          <span class="summary-card__label">Заявок за 30 дней</span>
          <span class="summary-card__value-row">
            <span class="summary-card__value" data-stat="leads">0</span>
            <span class="summary-card__change" data-stat="conversion">0%</span>
          </span>
          <span class="summary-card__note">переходы к анкете / заявке</span>
        </article>
      </section>

      <nav class="filters" aria-label="Фильтр проектов">
        <span class="section-label">Проект</span>
        <div id="projectFilters"></div>
      </nav>

      <section class="section-head">
        <div class="section-title">
          <h2>Виджеты</h2>
          <span class="count-label" data-count-label>0 шт.</span>
        </div>
        <div class="tools">
          <input class="search" id="widgetSearch" type="search" placeholder="Поиск по названию, сайту или ID">
          <button class="button button--primary" data-action="create">Создать виджет</button>
        </div>
      </section>

      <section class="widgets" id="widgetsList" aria-label="Список виджетов"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="codeModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle">Код установки</h2>
        <button class="button" data-action="close-modal">Закрыть</button>
      </div>
      <div class="modal__body">
        <pre class="code" id="installCode"></pre>
      </div>
      <div class="modal__actions">
        <button class="button" data-action="copy-code">Скопировать код</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_WEBHOOK_ENDPOINT = "https://155-212-191-195.sslip.io/widgets0-webhook";
    const DEFAULT_ANALYTICS_SUMMARY_ENDPOINT = `${DEFAULT_WEBHOOK_ENDPOINT}/analytics/summary`;
    const DEFAULT_ANALYTICS_ENDPOINT = `${DEFAULT_WEBHOOK_ENDPOINT}/analytics/events`;

    const widgets = [
      {
        id: "lera-candles-wheel",
        title: "Колесо фортуны",
        project: "Дневник свечника / TNT",
        filter: "lera",
        domain: "dnevniksvechnika.ru",
        type: "Колесо фортуны",
        source: "lera-dnevnik-svechnika",
        previewUrl: "https://widgets0.github.io/widgets0/gallery/%D0%BA%D0%BB%D0%B8%D0%B5%D0%BD%D1%82%D1%8B/%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82-001-%D1%81%D0%B2%D0%B5%D1%87%D0%B8/lera-candles-wheel-static.html?preview=1",
        analyticsWidgetId: "lera-candles-wheel",
        analyticsClientId: "tnt",
        active: true,
        behavior: ["Раз в сутки", "Показ через 5 мин.", "Popup поверх сайта", "Десктоп и мобильные"],
        fallback: {
          widget_shown: 0,
          widget_closed: 0,
          wheel_spin_click: 0,
          prize_shown: 0,
          prize_link_click: 0
        },
        code: `<script
  src="https://widgets0.github.io/widgets0/clients/lera-dnevnik-svechnika/loader.js?v=utm-random-20260811"
  data-delay="300"
  data-frequency="once_per_day"
  data-position="center"
  data-backdrop="rgba(0, 0, 0, 0.72)"
  data-analytics-endpoint="${DEFAULT_ANALYTICS_ENDPOINT}"
  data-client-id="tnt"
  data-widget-id="lera-candles-wheel"
  async><\\/script>`
      },
      {
        id: "demo-wheel",
        title: "Колесо фортуны — демо",
        project: "Демо-клиент",
        filter: "demo",
        domain: "example.com",
        type: "Колесо фортуны",
        source: "demo-wheel",
        previewUrl: "https://widgets0.github.io/widgets0/gallery/widgets/wheel-fortune-widget.html?preview=1",
        analyticsWidgetId: "demo-wheel",
        active: true,
        behavior: ["Показ всегда", "Задержка 2 сек.", "Все страницы", "Десктоп и мобильные"],
        fallback: {
          widget_shown: 108,
          widget_closed: 23,
          wheel_spin_click: 67,
          prize_shown: 55,
          prize_link_click: 41
        }
      },
      {
        id: "demo-tinder",
        title: "Товарный Тиндер — демо",
        project: "Демо-клиент",
        filter: "demo",
        domain: "example.com",
        type: "Товарный Тиндер",
        source: "demo-tinder",
        previewUrl: "https://widgets0.github.io/widgets0/gallery/widgets/tinder-product-widget.html?preview=swiping",
        analyticsWidgetId: "demo-tinder",
        active: true,
        behavior: ["Раз в час", "Показ через 1 сек.", "Карточки товаров", "Десктоп и мобильные"],
        fallback: {
          widget_shown: 137,
          widget_closed: 18,
          wheel_spin_click: 64,
          prize_shown: 42,
          prize_link_click: 12
        }
      }
    ];

    let analyticsSummary = null;
    let analyticsStatus = "idle";
    let activeFilter = "all";
    let searchQuery = "";

    const state = {
      activeById: Object.fromEntries(widgets.map(widget => [widget.id, widget.active]))
    };

    const filtersEl = document.getElementById("projectFilters");
    const widgetsListEl = document.getElementById("widgetsList");
    const searchEl = document.getElementById("widgetSearch");
    const toastEl = document.getElementById("toast");
    const codeModal = document.getElementById("codeModal");
    const installCodeEl = document.getElementById("installCode");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("ru-RU").format(Number(value || 0));
    }

    function percent(part, total) {
      const totalNumber = Number(total || 0);
      if (!totalNumber) return 0;
      return Math.round(Number(part || 0) / totalNumber * 100);
    }

    function clampPercent(value) {
      return Math.max(0, Math.min(100, Number(value || 0)));
    }

    function emptyEvents() {
      return {
        widget_shown: 0,
        widget_closed: 0,
        wheel_spin_click: 0,
        prize_shown: 0,
        prize_link_click: 0
      };
    }

    function getWidgetAnalytics(widget) {
      const list = analyticsSummary?.widgets || [];
      return list.find(entry => [entry.widgetId, entry.source].includes(widget.analyticsWidgetId || widget.source || widget.id)) || null;
    }

    function hasRealAnalytics(widget) {
      const entry = getWidgetAnalytics(widget);
      return Boolean(entry && Object.values(entry.events || {}).some(value => Number(value || 0) > 0));
    }

    function getWidgetEvents(widget) {
      const real = getWidgetAnalytics(widget)?.events;
      if (real) return { ...emptyEvents(), ...real };
      return { ...emptyEvents(), ...(widget.fallback || {}) };
    }

    function visibleWidgets() {
      const normalized = searchQuery.trim().toLowerCase();
      return widgets.filter(widget => {
        const matchesFilter = activeFilter === "all" || widget.filter === activeFilter;
        const haystack = `${widget.title} ${widget.project} ${widget.domain} ${widget.type} ${widget.source}`.toLowerCase();
        return matchesFilter && (!normalized || haystack.includes(normalized));
      });
    }

    function projectFilters() {
      const groups = [
        { id: "all", label: "Все проекты", count: widgets.length },
        { id: "lera", label: "Дневник свечника", count: widgets.filter(widget => widget.filter === "lera").length },
        { id: "demo", label: "Демо-клиент", count: widgets.filter(widget => widget.filter === "demo").length }
      ];

      return groups.filter(group => group.id === "all" || group.count > 0);
    }

    function renderFilters() {
      filtersEl.innerHTML = projectFilters().map(group => `
        <button class="filter-pill ${activeFilter === group.id ? "is-active" : ""}" data-filter="${group.id}">
          ${escapeHtml(group.label)}
          <span>${formatNumber(group.count)}</span>
        </button>
      `).join("") + (activeFilter !== "all" ? '<button class="reset-filter" data-filter="all">Сбросить фильтр</button>' : "");
    }

    function renderStats() {
      const totals = widgets.reduce((acc, widget) => {
        const events = getWidgetEvents(widget);
        acc.shows += Number(events.widget_shown || 0);
        acc.leads += Number(events.prize_link_click || 0);
        return acc;
      }, { shows: 0, leads: 0 });

      const sites = new Set(widgets.map(widget => widget.domain).filter(Boolean)).size;
      const projects = new Set(widgets.map(widget => widget.project).filter(Boolean)).size;
      const active = Object.values(state.activeById).filter(Boolean).length;

      document.querySelector('[data-stat="projects"]').textContent = formatNumber(projects);
      document.querySelector('[data-stat="total"]').textContent = formatNumber(widgets.length);
      document.querySelector('[data-stat="shows"]').textContent = formatNumber(totals.shows);
      document.querySelector('[data-stat="leads"]').textContent = formatNumber(totals.leads);
      document.querySelector('[data-stat="conversion"]').textContent = `${percent(totals.leads, totals.shows)}%`;
      document.querySelector('[data-stat-note="projects"]').textContent = `по ${formatNumber(sites)} сайтам`;
      document.querySelector('[data-stat-note="active"]').textContent = active === widgets.length ? "все активны" : `${formatNumber(active)} активны`;
      document.querySelector('[data-stat-note="sites"]').textContent = `по ${formatNumber(sites)} сайтам`;
    }

    function widgetIcon(widget) {
      return widget.type.includes("Тиндер")
        ? '<div class="widget-icon__cards"></div>'
        : '<div class="widget-icon__wheel"></div>';
    }

    function renderMetric(label, value, total, barClass = "") {
      const rate = total ? clampPercent(percent(value, total)) : value ? 100 : 0;
      return `
        <div class="metric">
          <span class="metric__label">${escapeHtml(label)}</span>
          <span class="metric__value">${formatNumber(value)}</span>
          <span class="bar ${barClass}" style="--value:${rate}%"><span></span></span>
        </div>
      `;
    }

    function renderRate(value, total) {
      return `<div class="rate"><span>${percent(value, total)}%</span></div>`;
    }

    function renderWidget(widget) {
      const events = getWidgetEvents(widget);
      const shown = Number(events.widget_shown || 0);
      const spins = Number(events.wheel_spin_click || 0);
      const prizes = Number(events.prize_shown || 0);
      const leads = Number(events.prize_link_click || 0);
      const closed = Number(events.widget_closed || 0);
      const isActive = Boolean(state.activeById[widget.id]);
      const realData = hasRealAnalytics(widget);
      const code = widget.code || `<script src="https://widgets0.github.io/widgets0/widget-loader.js" data-widget="${widget.id}" data-source="${widget.source}" async><\\/script>`;

      return `
        <article class="widget-card" data-widget-card="${escapeHtml(widget.id)}">
          <div class="widget-card__top">
            <div class="widget-info">
              <div class="widget-icon">${widgetIcon(widget)}</div>
              <div class="widget-copy">
                <div class="widget-title-row">
                  <span class="widget-title">${escapeHtml(widget.title)}</span>
                  <span class="status ${isActive ? "" : "status--off"}">${isActive ? "Активен" : "Выключен"}</span>
                  ${realData ? "" : '<span class="status status--waiting">Ждём первых данных</span>'}
                </div>
                <div class="widget-meta">
                  <span class="mono">${escapeHtml(widget.domain)}</span>
                  <span class="sep">/</span>
                  <span>${escapeHtml(widget.type)}</span>
                  <span class="sep">/</span>
                  <span>${escapeHtml(widget.project)}</span>
                  <span class="sep">/</span>
                  <span class="mono">${escapeHtml(widget.source)}</span>
                </div>
              </div>
            </div>
            <div class="widget-actions">
              <a class="button" href="${escapeHtml(widget.previewUrl || "#")}" target="_blank" rel="noreferrer">Посмотреть виджет</a>
              <button class="button" data-action="code" data-id="${escapeHtml(widget.id)}" data-code="${escapeHtml(code)}">Код</button>
              <button class="button" data-action="configure" data-id="${escapeHtml(widget.id)}">Настроить</button>
              <button class="switch-wrap" data-action="toggle" data-id="${escapeHtml(widget.id)}" aria-label="Переключить виджет">
                <span class="switch-label ${isActive ? "" : "is-off"}">${isActive ? "Вкл" : "Выкл"}</span>
                <span class="switch ${isActive ? "" : "is-off"}"></span>
              </button>
            </div>
          </div>

          <div class="behavior">
            <span class="widget-chip-label">Поведение</span>
            ${widget.behavior.map(item => `<span class="behavior-pill">${escapeHtml(item)}</span>`).join("")}
          </div>

          <div class="funnel">
            ${renderMetric("Показали виджет", shown, shown)}
            ${renderRate(spins, shown)}
            ${renderMetric("Нажали крутить", spins, shown, "bar--blue")}
            ${renderRate(prizes, spins)}
            ${renderMetric("Увидели приз", prizes, shown, "bar--blue")}
            ${renderRate(leads, shown)}
            ${renderMetric("Нажали забрать", leads, shown, "bar--green")}
            <div class="side-metric">
              <div class="side-metric__top">
                <span class="metric__label">Закрыли крестиком</span>
                <div class="metric__row">
                  <span class="side-metric__value">${formatNumber(closed)}</span>
                  <span class="metric__sub">${percent(closed, shown)}%</span>
                </div>
              </div>
              <button class="button button--primary" data-action="leads" data-id="${escapeHtml(widget.id)}">Заявки (${formatNumber(leads)})</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderWidgets() {
      const list = visibleWidgets();
      document.querySelector("[data-count-label]").textContent = `${formatNumber(list.length)} шт.`;
      widgetsListEl.innerHTML = list.length
        ? list.map(renderWidget).join("")
        : '<div class="empty">Ничего не найдено. Попробуй изменить фильтр или поиск.</div>';
    }

    function renderAll() {
      renderFilters();
      renderStats();
      renderWidgets();
    }

    async function loadAnalyticsSummary(showToastAfter = false) {
      analyticsStatus = "loading";
      renderWidgets();
      try {
        const response = await fetch(DEFAULT_ANALYTICS_SUMMARY_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error("analytics unavailable");
        analyticsSummary = await response.json();
        analyticsStatus = "ready";
        renderAll();
        if (showToastAfter) showToast("Статистика обновлена");
      } catch (error) {
        analyticsStatus = "error";
        renderAll();
        if (showToastAfter) showToast("Статистика пока недоступна");
      }
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("is-visible"), 2200);
    }

    function openCodeModal(code) {
      installCodeEl.textContent = code;
      codeModal.classList.add("is-visible");
      codeModal.setAttribute("aria-hidden", "false");
    }

    function closeCodeModal() {
      codeModal.classList.remove("is-visible");
      codeModal.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("click", async event => {
      const filterButton = event.target.closest("[data-filter]");
      if (filterButton) {
        activeFilter = filterButton.dataset.filter || "all";
        renderAll();
        return;
      }

      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const widgetId = actionEl.dataset.id;

      if (action === "sync") {
        loadAnalyticsSummary(true);
      }

      if (action === "create") {
        showToast("Создание виджета подключим следующим шагом");
      }

      if (action === "configure") {
        showToast("Настройки откроем в следующей версии кабинета");
      }

      if (action === "leads") {
        showToast("Заявки считаются по нажатию кнопки «Забрать»");
      }

      if (action === "toggle" && widgetId) {
        state.activeById[widgetId] = !state.activeById[widgetId];
        renderAll();
      }

      if (action === "code") {
        openCodeModal(actionEl.dataset.code || "");
      }

      if (action === "close-modal") {
        closeCodeModal();
      }

      if (action === "copy-code") {
        try {
          await navigator.clipboard.writeText(installCodeEl.textContent);
          showToast("Код скопирован");
        } catch (error) {
          showToast("Код можно выделить и скопировать вручную");
        }
      }
    });

    codeModal.addEventListener("click", event => {
      if (event.target === codeModal) closeCodeModal();
    });

    searchEl.addEventListener("input", event => {
      searchQuery = event.target.value || "";
      renderWidgets();
    });

    renderAll();
    loadAnalyticsSummary();
  </script>
</body>
</html>
