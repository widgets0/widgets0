<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задать вопрос</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Tenor+Sans&display=swap');

    :root {
      --lera-ink: #382b23;
      --lera-ink-soft: #7c6959;
      --lera-beige: #99775a;
      --lera-paper: #fcfaf8;
      --lera-white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--lera-white);
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--lera-white);
    }

    .cat-banner-wrapper {
      width: 100%;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    .cat-banner-wrapper * { box-sizing: border-box; }

    .cat-card {
      width: min(100%, 920px);
      height: 340px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 304px;
      background: var(--lera-paper);
      border: 1px solid #ead9c8;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(85, 60, 42, 0.09);
    }

    .cat-content {
      align-self: center;
      padding: 30px 44px 30px 46px;
      position: relative;
      z-index: 2;
    }

    .cat-title {
      margin: 0 0 15px;
      color: var(--lera-ink);
      font-family: 'Tenor Sans', Arial, sans-serif;
      font-size: clamp(32px, 4.5vw, 43px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }

    .cat-subtitle {
      max-width: 470px;
      margin: 0 0 25px;
      color: var(--lera-ink-soft);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.62;
    }

    .cat-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 28px;
      border: 0;
      border-radius: 999px;
      background: var(--lera-beige);
      color: var(--lera-white);
      box-shadow: 0 10px 24px rgba(86, 58, 39, 0.14);
      cursor: pointer;
      font: 500 12px/1 'Tenor Sans', Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .cat-btn:hover {
      background: #88664c;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(86, 58, 39, 0.2);
    }

    .cat-image-wrapper {
      min-width: 0;
      margin: 15px 15px 15px 0;
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-radius: 20px;
      background: #3a2d27;
    }

    .cat-image-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(21, 19, 17, 0.18), transparent 38%), linear-gradient(0deg, rgba(21, 19, 17, 0.24), transparent 44%);
      pointer-events: none;
    }

    .cat-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 48%;
      filter: saturate(0.86) contrast(1.04) brightness(0.94);
    }

    @media (max-width: 700px) {
      body { padding: 18px; }

      .cat-card {
        grid-template-columns: 1fr;
        height: auto;
        border-radius: 24px;
      }

      .cat-content {
        padding: 40px 30px 34px;
        text-align: center;
      }

      .cat-title {
        margin-bottom: 18px;
        font-size: clamp(29px, 9.5vw, 36px);
      }

      .cat-subtitle {
        margin: 0 auto 28px;
        font-size: 13px;
      }

      .cat-image-wrapper {
        width: calc(100% - 36px);
        height: auto;
        aspect-ratio: 1 / 1;
        margin: 6px 18px 18px;
        border-radius: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="cat-banner-wrapper">
    <div class="cat-card">
      <div class="cat-content">
        <h2 class="cat-title">Остались вопросы?</h2>
        <p class="cat-subtitle">
          Свяжись с нашей службой заботы напрямую и задай любые уточняющие вопросы
        </p>
        <a class="cat-btn" href="https://t.me/valeriechvileva_help" target="_blank" rel="noopener noreferrer">Задать вопрос</a>
      </div>

      <div class="cat-image-wrapper">
        <video class="cat-video" autoplay muted loop playsinline preload="metadata" aria-label="Зажигаем свечу">
          <source src="./candle-contact-loop.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const analytics = Object.assign({
        endpoint: '',
        clientId: 'tnt',
        widgetId: 'lera-candle-contact',
        source: 'lera-candle-contact-widget'
      }, window.LERA_CANDLE_CONTACT_ANALYTICS_CONFIG || {});
      const contactCard = document.querySelector('.cat-card');
      const contactLink = document.querySelector('.cat-btn');
      let viewTracked = false;

      function track(eventName) {
        const endpoint = String(analytics.endpoint || '').trim();
        if (!endpoint) return;

        const body = JSON.stringify({
          event: eventName,
          widgetId: analytics.widgetId,
          clientId: analytics.clientId,
          source: analytics.source,
          page: window.location.href,
          referrer: document.referrer || '',
          createdAt: new Date().toISOString()
        });

        try {
          fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body,
            mode: 'cors',
            keepalive: true
          }).catch(function () {
            try {
              if (navigator.sendBeacon) navigator.sendBeacon(endpoint, body);
            } catch (error) {}
          });
        } catch (error) {
          try {
            if (navigator.sendBeacon) navigator.sendBeacon(endpoint, body);
          } catch (beaconError) {}
        }
      }

      track('widget_loaded');

      function trackView() {
        if (viewTracked) return;
        viewTracked = true;
        track('widget_shown');
      }

      if (contactCard && 'IntersectionObserver' in window) {
        const observer = new IntersectionObserver(function (entries) {
          if (!entries.some(function (entry) { return entry.isIntersecting && entry.intersectionRatio >= 0.4; })) return;
          observer.disconnect();
          trackView();
        }, { threshold: [0.4] });
        observer.observe(contactCard);
      } else {
        trackView();
      }

      if (contactLink) {
        contactLink.addEventListener('click', function () {
          track('prize_link_click');
        });
      }
    })();
  </script>

</body>
</html>
